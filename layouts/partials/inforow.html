{{ $label := .label | markdownify | safeHTML }}
{{ $content := .content | markdownify | safeHTML }}
{{ $icon := path.Join "/icons" (.icon | printf "%s.svg") }}
<tr class="infosheet-row">
    <td class="infosheet-cell infosheet-label">{{ $label }}</td>
    <td class="infosheet-cell infosheet-iconcell">
        <img src="{{ $icon }}" class="infosheet-icon" alt="{{ $label }}" />
    </td>
    <td class="infosheet-cell infosheet-content">{{ $content }}</td>
</tr>
